services:
  postgres:
    image: postgres:16-alpine
    container_name: nara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - nara_pgdata:/var/lib/postgresql/data

volumes:
  nara_pgdata:
